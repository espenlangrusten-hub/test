services:
  - type: web
    name: tactical-lineup-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Generated by Render, never committed.
      - key: JWT_SECRET
        generateValue: true
      # Paste your MongoDB Atlas connection string in the Render dashboard.
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: tactical_lineup
